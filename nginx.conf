server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app — every unknown path serves index.html, the router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for fingerprinted assets that Vite emits under /assets.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache the HTML shell — it pins which JS bundle to load.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Health probe for orchestrators / Traefik.
    location = /_healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
